name: Server Binary 🧳

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create or update a date-titled GitHub release
        required: false
        type: boolean
        default: true
  push:
    branches:
      - develop
    paths:
      - .github/workflows/build_binary.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/**
      - packaging/binary/**
  pull_request:
    paths:
      - .github/workflows/build_binary.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/**
      - packaging/binary/**

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Server binaries (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            artifact_name: jellyfin-vue-server-linux-static
            pkg_targets: node24-linuxstatic-x64,node24-linuxstatic-arm64
          - platform: macos
            runner: macos-latest
            artifact_name: jellyfin-vue-server-macos
            pkg_targets: node24-macos-x64,node24-macos-arm64
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    env:
      OUTPUT_DIR: dist/binary

    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          show-progress: false

      - name: Setup node environment ⚙️
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          check-latest: true

      - name: Install dependencies 📦
        run: corepack pnpm ci

      - name: Build frontend 🛠️
        run: corepack pnpm -C packages/frontend build

      - name: Prepare embedded assets 📁
        run: |
          rm -rf packaging/binary/dist "$OUTPUT_DIR"
          mkdir -p packaging/binary/dist "$OUTPUT_DIR"
          cp -R packages/frontend/dist/. packaging/binary/dist/

      - name: Build server binaries 🧳
        env:
          PKG_TARGETS: ${{ matrix.pkg_targets }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          corepack pnpm dlx @yao-pkg/pkg@6.19.0 packaging/binary --targets "$PKG_TARGETS" --out-path "$OUTPUT_DIR"

          case "$PLATFORM" in
            linux)
              mv "$OUTPUT_DIR/jellyfin-vue-x64" "$OUTPUT_DIR/jellyfin-vue-linux-x86_64"
              mv "$OUTPUT_DIR/jellyfin-vue-arm64" "$OUTPUT_DIR/jellyfin-vue-linux-aarch64"
              ;;
            macos)
              mv "$OUTPUT_DIR/jellyfin-vue-x64" "$OUTPUT_DIR/jellyfin-vue-macos-x86_64"
              mv "$OUTPUT_DIR/jellyfin-vue-arm64" "$OUTPUT_DIR/jellyfin-vue-macos-aarch64"
              ;;
          esac

          chmod +x "$OUTPUT_DIR"/jellyfin-vue-"$PLATFORM"-*
          (
            cd "$OUTPUT_DIR"
            shasum -a 256 jellyfin-vue-"$PLATFORM"-* > SHA256SUMS
          )

      - name: Upload server binaries ⬆️
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: artifact
        with:
          compression-level: 0
          name: ${{ matrix.artifact_name }}
          path: ${{ env.OUTPUT_DIR }}

      - name: Create provenance attestation 🔏
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        continue-on-error: true
        with:
          subject-name: ${{ matrix.artifact_name }}
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}

  release:
    name: Date-titled GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    permissions:
      contents: write
    env:
      RELEASE_DATE_TZ: America/New_York
      RELEASE_DIR: release-assets
      UPLOAD_DIR: release-upload

    steps:
      - name: Download server binary artifacts ⬇️
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jellyfin-vue-server-*
          path: ${{ env.RELEASE_DIR }}

      - name: Prepare release assets 📦
        run: |
          mkdir -p "$UPLOAD_DIR"
          find "$RELEASE_DIR" -type f ! -name SHA256SUMS -exec cp {} "$UPLOAD_DIR"/ \;
          find "$RELEASE_DIR" -type f -name SHA256SUMS -exec cat {} \; | sort -k 2 > "$UPLOAD_DIR/SHA256SUMS"
          ls -lah "$UPLOAD_DIR"

      - name: Prepare release metadata 🏷️
        id: release
        run: |
          release_date="$(TZ="$RELEASE_DATE_TZ" date +'%Y%m%d')"
          tag_name="snapshot-${release_date}-${GITHUB_RUN_NUMBER}"

          {
            echo "tag=$tag_name"
            echo "title=$release_date"
          } >> "$GITHUB_OUTPUT"

          {
            echo "Automated server-binary release for $release_date."
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > release-notes.md

      - name: Publish GitHub release 🚀
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file release-notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG_NAME" "$UPLOAD_DIR"/* --clobber
