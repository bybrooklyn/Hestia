name: Tauri Desktop 🖥️

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create or update a date-titled GitHub release
        required: false
        type: boolean
        default: true
  push:
    branches:
      - develop
    paths:
      - .github/workflows/build_tauri.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/**
      - packaging/tauri/**
  pull_request:
    paths:
      - .github/workflows/build_tauri.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/**
      - packaging/tauri/**

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Tauri desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            artifact_name: hestia-linux
          - platform: macos
            runner: macos-latest
            artifact_name: hestia-macos
          - platform: windows
            runner: windows-latest
            artifact_name: hestia-windows
    permissions:
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: packaging/tauri
    env:
      OUTPUT_DIR: dist/tauri

    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          show-progress: false

      - name: Setup node environment ⚙️
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          check-latest: true

      - name: Setup Rust toolchain and cache 🦀
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache-key: tauri-${{ runner.os }}
          cache-workspaces: packaging/tauri

      - name: Install Linux dependencies 📦🐧
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt update -qq
          read -r -a packages < apt_packages
          sudo apt install -y --no-install-recommends "${packages[@]}"

      - name: Install dependencies 📦
        run: corepack pnpm ci

      - name: Build Tauri desktop app 🛠️
        run: corepack pnpm build

      - name: Ad-hoc codesign macOS bundle 🔏
        if: ${{ matrix.platform == 'macos' }}
        run: |
          APP_PATH="$(find target/release/bundle/macos -maxdepth 2 -name '*.app' -print -quit)"
          DMG_PATH="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          codesign -s - --force --deep "$APP_PATH"
          [ -n "$DMG_PATH" ] && codesign -s - --force "$DMG_PATH" || true

      - name: Prepare Tauri artifacts 📦
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          node <<'NODE'
          const { copyFileSync, existsSync, mkdirSync, readdirSync, rmSync, statSync, writeFileSync } = require('node:fs');
          const { createHash } = require('node:crypto');
          const { basename, join } = require('node:path');

          const outputDir = process.env.OUTPUT_DIR;
          const platform = process.env.PLATFORM;
          const specs = {
            linux: [{ dir: 'target/release/bundle/appimage', suffix: '.AppImage' }],
            macos: [{ dir: 'target/release/bundle/dmg', suffix: '.dmg' }],
            windows: [
              { dir: 'target/release', suffix: '.exe', exact: 'hestia.exe' },
              { dir: 'target/release/bundle/msi', suffix: '.msi' }
            ]
          };

          function collectFiles(spec) {
            if (!existsSync(spec.dir)) {
              return [];
            }

            return readdirSync(spec.dir)
              .map(name => join(spec.dir, name))
              .filter(path => statSync(path).isFile())
              .filter(path => spec.exact ? basename(path) === spec.exact : path.endsWith(spec.suffix));
          }

          rmSync(outputDir, { force: true, recursive: true });
          mkdirSync(outputDir, { recursive: true });

          const files = specs[platform].flatMap(collectFiles);

          if (files.length === 0) {
            throw new Error(`No Tauri artifacts found for ${platform}`);
          }

          const checksums = [];

          for (const file of files) {
            const target = join(outputDir, basename(file));
            copyFileSync(file, target);
            checksums.push(`${createHash('sha256').update(require('node:fs').readFileSync(target)).digest('hex')}  ${basename(file)}`);
          }

          writeFileSync(join(outputDir, 'SHA256SUMS'), `${checksums.sort().join('\n')}\n`);
          NODE

          ls -lah "$OUTPUT_DIR"

      - name: Upload Tauri desktop artifact ⬆️
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: artifact
        with:
          compression-level: 0
          name: ${{ matrix.artifact_name }}
          path: packaging/tauri/${{ env.OUTPUT_DIR }}

      - name: Create provenance attestation 🔏
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        continue-on-error: true
        with:
          subject-name: ${{ matrix.artifact_name }}
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}

  release:
    name: Date-titled GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    permissions:
      contents: write
    env:
      RELEASE_DATE_TZ: America/New_York
      RELEASE_DIR: release-assets
      UPLOAD_DIR: release-upload

    steps:
      - name: Download Tauri desktop artifacts ⬇️
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hestia-*
          path: ${{ env.RELEASE_DIR }}

      - name: Prepare release assets 📦
        run: |
          mkdir -p "$UPLOAD_DIR"
          find "$RELEASE_DIR" -type f ! -name SHA256SUMS -exec cp {} "$UPLOAD_DIR"/ \;
          find "$RELEASE_DIR" -type f -name SHA256SUMS -exec cat {} \; | sort -k 2 > "$UPLOAD_DIR/SHA256SUMS"
          ls -lah "$UPLOAD_DIR"

      - name: Prepare release metadata 🏷️
        id: release
        run: |
          release_date="$(TZ="$RELEASE_DATE_TZ" date +'%Y%m%d')"
          tag_name="tauri-snapshot-${release_date}-${GITHUB_RUN_NUMBER}"

          {
            echo "tag=$tag_name"
            echo "title=$release_date Tauri"
          } >> "$GITHUB_OUTPUT"

          {
            echo "Automated Tauri desktop release for $release_date."
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > release-notes.md

      - name: Publish GitHub release 🚀
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file release-notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG_NAME" "$UPLOAD_DIR"/* --clobber
