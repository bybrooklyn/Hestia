[package]
name = "hestia"
version = "0.0.0"
description = "Hestia desktop client (Jellyfin Vue fork)"
authors = [
  "bybrooklyn <brooklyn.halmstad@proton.me>"
]
license = "GPL-3.0-only"
repository = "https://github.com/bybrooklyn/Hestia"
default-run = "hestia"
build = "src/build.rs"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }

[dependencies]
tauri = { version = "=2.11.1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
opt-level = 3
